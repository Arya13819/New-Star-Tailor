databases:
  - name: new-star-tailor-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"

services:
  - type: web
    name: new-star-tailor
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && pybabel compile -d app/translations"
    # Idempotent on every start — safe to re-run on a redeploy with no new
    # migrations, and the server never comes up against a broken schema.
    startCommand: "flask --app wsgi db upgrade && flask --app wsgi nst seed-services && gunicorn --bind 0.0.0.0:$PORT wsgi:app"
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: new-star-tailor-db
          property: connectionString
      # Render's own load balancer is the proxy in front of the app —
      # trust it for X-Forwarded-* (the app's own ProxyFix already only
      # trusts one hop; this just tells Gunicorn the same thing).
      - key: GUNICORN_FORWARDED_ALLOW_IPS
        value: "*"
