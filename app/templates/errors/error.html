{% extends "base.html" %}
{% block title %}{{ status }} — {{ SHOP.name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="display-1 text-gold fw-bold">{{ status }}</div>
  <h1 class="h4 mt-2">{{ title }}</h1>
  <p class="text-secondary">{{ detail }}</p>
  <a class="btn btn-primary mt-2" href="{{ url_for('public.home') }}">{{ _('Go to the homepage') }}</a>
</div>
{% endblock %}
