<section class="shop-location" aria-label="{{ _('Shop location on Google Maps') }}">
  <div class="location-header">
    <div><p class="section-label">{{ _('COME SAY HELLO') }}</p><h2>{{ _('Find us in Neemuch.') }}</h2></div>
    <a class="location-open" href="https://www.google.com/maps?q={{ SHOP.latitude }},{{ SHOP.longitude }}&amp;z=17&amp;hl={{ CURRENT_LOCALE }}" target="_blank" rel="noopener noreferrer">{{ _('Open in Google Maps') }} <span aria-hidden="true">↗</span></a>
  </div>
  <div class="location-map">
    <iframe src="https://www.google.com/maps?q={{ SHOP.latitude }},{{ SHOP.longitude }}&amp;z=17&amp;hl={{ CURRENT_LOCALE }}&amp;output=embed"
            title="{{ _('Google Maps location of New Star Tailor in Neemuch') }}"
            width="1200" height="430" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen></iframe>
  </div>
  <div class="location-bottom"><div class="location-address"><span class="location-pin" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" width="23" height="23"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6"/></svg></span><div><strong>{{ SHOP.name }}</strong><p>{{ SHOP.address }}</p></div></div><a class="btn btn-primary" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&amp;destination={{ SHOP.latitude }},{{ SHOP.longitude }}">{{ _('Get directions') }} <span aria-hidden="true">↗</span></a></div>
</section>
