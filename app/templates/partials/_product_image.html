{% macro product_image(filename, alt, class_name='', eager=False, sizes='(max-width: 767px) calc(100vw - 44px), 380px') -%}
{% set stem = filename.rsplit('.', 1)[0] %}
<picture>
  <source type="image/webp"
          srcset="{{ url_for('static', filename='img/optimized/' ~ stem ~ '-320.webp') }} 320w, {{ url_for('static', filename='img/optimized/' ~ stem ~ '-640.webp') }} 640w"
          sizes="{{ sizes }}">
  <img src="{{ url_for('static', filename='img/services/' ~ filename) }}"
       alt="{{ alt }}" class="{{ class_name }}" width="700" height="716"
       loading="{{ 'eager' if eager else 'lazy' }}" decoding="async"
       {% if eager %}fetchpriority="high"{% endif %}>
</picture>
{%- endmacro %}
