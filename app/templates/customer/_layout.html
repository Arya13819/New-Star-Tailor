{% extends "base.html" %}

{% block content %}
<nav class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4 no-print">
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-sm {{ 'btn-primary' if active == 'dashboard' else 'btn-outline-primary' }}"
       href="{{ url_for('customer.dashboard') }}">{{ _('My account') }}</a>
    <a class="btn btn-sm {{ 'btn-primary' if active == 'orders' else 'btn-outline-primary' }}"
       href="{{ url_for('customer.orders') }}">{{ _('My orders') }}</a>
    <a class="btn btn-sm {{ 'btn-primary' if active == 'measurements' else 'btn-outline-primary' }}"
       href="{{ url_for('customer.measurements') }}">{{ _('Measurements') }}</a>
    <a class="btn btn-sm {{ 'btn-primary' if active == 'payments' else 'btn-outline-primary' }}"
       href="{{ url_for('customer.payments') }}">{{ _('Payments') }}</a>
  </div>
  <form method="post" action="{{ url_for('auth.customer_logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-sm btn-outline-secondary">{{ _('Sign out') }}</button>
  </form>
</nav>

{% block customer_content %}{% endblock %}
{% endblock %}
